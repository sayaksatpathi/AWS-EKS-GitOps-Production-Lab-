apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudlaunch-api
  namespace: cloudlaunch
  labels:
    app.kubernetes.io/name: cloudlaunch-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudlaunch-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
