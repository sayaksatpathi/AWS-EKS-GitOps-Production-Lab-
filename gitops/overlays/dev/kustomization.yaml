apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudlaunch

resources:
  - ../../base

images:
  - name: REGISTRY/cloudlaunch-api
    newName: REGISTRY_PLACEHOLDER/cloudlaunch-api
    newTag: "1.0.0"

patches:
  - path: replica-patch.yaml
    target:
      kind: Deployment
      name: cloudlaunch-api
