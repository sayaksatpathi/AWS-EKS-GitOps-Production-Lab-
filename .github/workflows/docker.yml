name: Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudlaunch-api

jobs:
  build-and-push:
    name: Build, Scan, and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      ecr_image: ${{ steps.meta.outputs.ecr_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image metadata
        id: meta
        run: |
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            VERSION="${{ github.event.inputs.image_tag }}"
          else
            VERSION="sha-${SHORT_SHA}"
          fi

          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: app/
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.ecr_image }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.ecr_image }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          output: trivy-report.txt

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-report.txt

      - name: Push image to ECR
        run: |
          docker push "${{ steps.meta.outputs.ecr_image }}"
          echo "Pushed: ${{ steps.meta.outputs.ecr_image }}"

      - name: Update GitOps image tag
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          IMAGE_TAG="${{ steps.meta.outputs.tag }}"
          ECR_REGISTRY="${{ steps.meta.outputs.registry }}"

          # Update the image tag in the overlay kustomization
          sed -i "s|newTag: .*|newTag: \"${IMAGE_TAG}\"|" gitops/overlays/dev/kustomization.yaml
          sed -i "s|newName: .*|newName: ${ECR_REGISTRY}/${{ env.ECR_REPOSITORY }}|" gitops/overlays/dev/kustomization.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(gitops): update image to ${IMAGE_TAG} [skip ci]"
          git push

      - name: Summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.meta.outputs.ecr_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.meta.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
